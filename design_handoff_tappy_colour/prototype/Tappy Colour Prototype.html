<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Tappy Colour — Pixel Native Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    background: #eaf6ff;
    color: #1f2e4a;
    -webkit-tap-highlight-color: transparent;
    --tc-display: "Pixelify Sans", "Silkscreen", system-ui, sans-serif;
    --tc-body: "Nunito", system-ui, sans-serif;
  }
  button { font-family: inherit; }
  /* Softer "modern pixel" rounded corners on key surfaces */
  :root {
    --tc-radius-pixel: 4px;
    --tc-radius-card: 6px;
  }
  @keyframes tcConfetti {
    0% { transform: translateY(-20px) rotate(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(80vh) rotate(720deg); opacity: 0.4; }
  }
  @keyframes tcMascotBob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-4px) rotate(2deg); }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tc/tokens.jsx"></script>
<script type="text/babel" src="tc/atoms.jsx"></script>
<script type="text/babel" src="tc/pixel-atoms.jsx"></script>

<script type="text/babel" src="tc/proto/app.jsx"></script>
<script type="text/babel" src="tc/proto/onboarding.jsx"></script>
<script type="text/babel" src="tc/proto/home.jsx"></script>
<script type="text/babel" src="tc/proto/difficulty.jsx"></script>
<script type="text/babel" src="tc/proto/puzzle.jsx"></script>
<script type="text/babel" src="tc/proto/completion-settings.jsx"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
  ReactDOM.createRoot(document.getElementById('root')).render(<ProtoApp/>);
</script>

</body>
</html>
